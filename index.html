<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 GPX 萬能助手 - 整合全功能版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #FF85A1;
            --secondary: #77DDFF;
            --path-color: #800000;
            --bg: #FFF5F7;
            --card-bg: #FFFFFF;
        }
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; background-color: var(--bg); color: #555; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(255, 133, 161, 0.1); margin-bottom: 20px; border: 3px solid #FFD1DC; position: relative; }
        h2 { color: var(--primary); margin-top: 0; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; justify-content: space-between; }
        .btn-pop { font-size: 0.6em; background: var(--secondary); color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; border: none; font-weight: bold; }
        textarea { width: 100%; height: 120px; margin: 10px 0; border: 2px solid #FFE4E1; border-radius: 15px; padding: 12px; box-sizing: border-box; outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 0.85em; color: #886666; margin-bottom: 5px; font-weight: bold; }
        select, input { padding: 12px; border-radius: 12px; border: 2px solid #F0F0F0; width: 100%; box-sizing: border-box; background: #FAFAFA; outline: none; }
        button.main-btn { background: linear-gradient(135deg, var(--primary), #FF6B81); color: white; border: none; cursor: pointer; font-weight: bold; padding: 14px; border-radius: 12px; font-size: 16px; width: 100%; margin-top: 10px; box-shadow: 0 5px 15px rgba(255,133,161,0.3); }
        #map { height: 350px; width: 100%; border-radius: 20px; border: 3px solid #FFD1DC; margin-top: 10px; z-index: 1; }
        .file-box { background: #FFF9FA; border: 3px dashed #FFD1DC; padding: 25px; text-align: center; border-radius: 20px; cursor: pointer; color: var(--primary); font-weight: bold; }
        #fileStatus { margin-top: 10px; font-weight: bold; text-align: center; color: #50C878; }
        .mode-selector { background: #FFF0F3; padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #FFD1DC; }
        .leaflet-tooltip-own { background: rgba(255, 255, 255, 0.8); border: 1px solid var(--primary); color: var(--primary); font-weight: bold; font-size: 11px; padding: 1px 3px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>
        <span>🗺️ 路徑即時預覽</span>
        <button class="btn-pop" onclick="openFullMap()">🔍 全螢幕開啟</button>
    </h2>
    <div id="map"></div>
</div>

<div class="card">
    <h2>🌺 功能 1~3：種花路徑產生器</h2>
    <label>🍭 請貼入原始座標 (緯度, 經度):</label>
    <textarea id="coordsInput" oninput="updatePreviewFromText()" placeholder="例如：25.033, 121.565"></textarea>

    <div class="controls">
        <div><label>📍 國家地名</label><input type="text" id="locName" value="土耳其"></div>
        <div><label>🆔 編號</label><input type="text" id="locID" value="01"></div>
        <div><label>📏 種花半徑 (m)</label><input type="number" id="radius" value="30" oninput="updatePreviewFromText()"></div>
        <div>
            <label>🎡 路徑模式</label>
            <select id="mode" onchange="updatePreviewFromText()">
                <option value="flower_pass2">種花 + 回訪二次 (Z串) ✨</option>
                <option value="flower_only">純種花模式 (Z) 🌺</option>
                <option value="pass_only">純座標路徑 (果) 🚶</option>
            </select>
        </div>
        <button class="main-btn" onclick="generateGPX()" style="grid-column: span 2;">確認無誤，下載夢幻 GPX 🎀</button>
    </div>
</div>

<div class="card">
    <h2>☁️ 功能 4：GPX 雙向轉換大師</h2>
    <div class="mode-selector">
        <label>🔄 請選擇轉換目標：</label>
        <select id="convMode">
            <option value="rte2wpt">🎯 轉為 Fake GPS 格式 (wpt)</option>
            <option value="wpt2rte">🕹️ 轉為 Joystick 格式 (rte)</option>
        </select>
    </div>
    <div class="file-box" onclick="document.getElementById('fileInput').click()">
        ✨ 點擊上傳任何 GPX 執行轉換 ✨
        <input type="file" id="fileInput" accept=".gpx" style="display:none" onchange="handleConversion(this)">
    </div>
    <div id="fileStatus"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var currentCoords = [];
var currentPathPoints = [];
var currentMode = 'flower_pass2';

var map = L.map('map').setView([25.033, 121.565], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var previewLayer = L.layerGroup().addTo(map);

// 更新地圖預覽核心邏輯
function updatePreview(coords, mode, radius) {
    previewLayer.clearLayers();
    currentPathPoints = [];
    currentCoords = coords;
    currentMode = mode;
    if (coords.length === 0) return;

    const mid = { lat: (coords[0].lat + coords[coords.length-1].lat) / 2, lon: (coords[0].lon + coords[coords.length-1].lon) / 2 };
    currentPathPoints.push([mid.lat, mid.lon]);

    coords.forEach((c, i) => {
        const label = (mode === 'pass_only') ? `T${i+1}` : `P${i+1}`;
        L.circleMarker([c.lat, c.lon], {color: '#FF85A1', radius: 4}).addTo(previewLayer)
            .bindTooltip(label, {permanent: true, direction: 'right', className: 'leaflet-tooltip-own'});

        currentPathPoints.push([c.lat, c.lon]);
        if (mode.includes('flower') && radius > 0) {
            const latOff = radius / 111000;
            const lonOff = radius / (111000 * Math.cos(c.lat * Math.PI / 180));
            [0, 60, 120, 180, 240, 300].forEach(a => {
                const rad = (90 - a) * Math.PI / 180;
                currentPathPoints.push([c.lat + latOff * Math.sin(rad), c.lon + lonOff * Math.cos(rad)]);
            });
            currentPathPoints.push([c.lat, c.lon]);
        }
    });
    
    currentPathPoints.push([mid.lat, mid.lon]);
    var polyline = L.polyline(currentPathPoints, {color: '#800000', weight: 3}).addTo(previewLayer);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
}

function updatePreviewFromText() {
    const input = document.getElementById('coordsInput').value.trim();
    const mode = document.getElementById('mode').value;
    const radius = parseFloat(document.getElementById('radius').value) || 0;
    const coords = input.split('\n').map(l => {
        const p = l.split(/[\s,]+/);
        return p.length >= 2 ? { lat: parseFloat(p[0]), lon: parseFloat(p[1]) } : null;
    }).filter(c => c !== null);
    updatePreview(coords, mode, radius);
}

// 功能 4 轉換邏輯
function handleConversion(input) {
    const file = input.files[0];
    if (!file) return;
    const convMode = document.getElementById('convMode').value;
    const reader = new FileReader();
    reader.onload = function(e) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(e.target.result, "text/xml");
        let nodes = Array.from(xml.querySelectorAll("rtept, wpt, trkpt"));
        let coords = nodes.map(n => ({
            lat: parseFloat(n.getAttribute("lat")),
            lon: parseFloat(n.getAttribute("lon"))
        })).filter(c => !isNaN(c.lat) && !isNaN(c.lon));

        if (coords.length === 0) { alert("讀不到座標點！"); return; }
        
        updatePreview(coords, 'pass_only', 0);
        
        let gpxStr = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Gemini" xmlns="http://www.topografix.com/GPX/1/1">`;
        if (convMode === 'rte2wpt') {
            coords.forEach((c, i) => gpxStr += `\n<wpt lat="${c.lat}" lon="${c.lon}"><name>T${i+1}</name></wpt>`);
        } else {
            gpxStr += `\n<rte><name>Converted_Route</name>`;
            coords.forEach(c => gpxStr += `\n<rtept lat="${c.lat}" lon="${c.lon}"></rtept>`);
            gpxStr += `\n</rte>`;
        }
        gpxStr += `\n</gpx>`;
        
        const blob = new Blob([gpxStr], { type: 'application/gpx+xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.name.replace(".gpx", "") + (convMode === 'rte2wpt' ? "_to_wpt.gpx" : "_to_rte.gpx");
        a.click();
        document.getElementById('fileStatus').innerText = `✅ 成功轉換 ${coords.length} 點！`;
    };
    reader.readAsText(file);
}

// 功能 1~3 下載邏輯
function generateGPX() {
    const input = document.getElementById('coordsInput').value.trim();
    const locName = document.getElementById('locName').value || "Loc";
    const locID = document.getElementById('locID').value || "01";
    const mode = document.getElementById('mode').value;
    const radius = parseFloat(document.getElementById('radius').value) || 30;
    
    let coords = input.split('\n').map(l => {
        const p = l.split(/[\s,]+/);
        return p.length >= 2 ? { lat: parseFloat(p[0]), lon: parseFloat(p[1]) } : null;
    }).filter(c => c !== null);

    if (coords.length === 0) { alert("請貼入座標！"); return; }
    
    let ptsXml = "";
    const mid = { lat: (coords[0].lat + coords[coords.length-1].lat) / 2, lon: (coords[0].lon + coords[coords.length-1].lon) / 2 };
    ptsXml += `<wpt lat="${mid.lat}" lon="${mid.lon}"><name>START</name></wpt>\n`;
    
    coords.forEach((c, i) => {
        if (mode.includes('flower')) {
            ptsXml += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-Center</name></wpt>\n`;
            const latOff = radius / 111000;
            const lonOff = radius / (111000 * Math.cos(c.lat * Math.PI / 180));
            [0, 60, 120, 180, 240, 300].forEach((a, j) => {
                const rad = (90 - a) * Math.PI / 180;
                ptsXml += `<wpt lat="${(c.lat + latOff * Math.sin(rad)).toFixed(7)}" lon="${(c.lon + lonOff * Math.cos(rad)).toFixed(7)}"><name>P${i+1}-F${j+1}</name></wpt>\n`;
            });
            ptsXml += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-End</name></wpt>\n`;
        } else {
            ptsXml += `<wpt lat="${c.lat}" lon="${c.lon}"><name>T${i+1}</name></wpt>\n`;
        }
    });

    if (mode === 'flower_pass2') {
        coords.forEach((c, i) => ptsXml += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-2nd</name></wpt>\n`);
    }

    const fullGpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1">\n${ptsXml}</gpx>`;
    const blob = new Blob([fullGpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${locName}${locID}.gpx`;
    a.click();
}

function openFullMap() {
    const newWin = window.open("", "_blank");
    newWin.document.write(`<html><head><title>全螢幕預覽</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /></head><body style="margin:0;"><div id="f" style="height:100vh;"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script><script>var m=L.map('f');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);var l=L.polyline(${JSON.stringify(currentPathPoints)},{color:'#800000'}).addTo(m);m.fitBounds(l.getBounds());<\/script></body></html>`);
}
</script>
</body>
</html>
