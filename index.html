<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 GPX 夢幻地圖助手_嫿</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #FF85A1; --secondary: #77DDFF; --accent: #FFB347; --bg: #FFF5F7; --card-bg: #FFFFFF; }
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; background-color: var(--bg); color: #555; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(255, 133, 161, 0.1); margin-bottom: 20px; border: 3px solid #FFD1DC; position: relative; }
        h2 { color: var(--primary); margin-top: 0; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; justify-content: space-between; }
        .btn-pop { font-size: 0.6em; background: var(--secondary); color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; border: none; font-weight: bold; }
        textarea { width: 100%; height: 120px; margin: 10px 0; border: 2px solid #FFE4E1; border-radius: 15px; padding: 12px; box-sizing: border-box; outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 0.85em; color: #886666; margin-bottom: 5px; font-weight: bold; }
        select, input { padding: 12px; border-radius: 12px; border: 2px solid #F0F0F0; width: 100%; box-sizing: border-box; background: #FAFAFA; outline: none; }
        button.main-btn { background: linear-gradient(135deg, var(--primary), #FF6B81); color: white; border: none; cursor: pointer; font-weight: bold; padding: 14px; border-radius: 12px; font-size: 16px; width: 100%; margin-top: 10px; box-shadow: 0 5px 15px rgba(255,133,161,0.3); transition: 0.3s; }
        #map { height: 300px; width: 100%; border-radius: 20px; border: 3px solid #FFD1DC; margin-top: 10px; z-index: 1; }
        .info-panel { background: #FFF9FA; border: 2px solid #FFD1DC; padding: 15px; border-radius: 15px; margin: 10px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; }
        .info-item b { color: var(--primary); }
        .file-box { background: #FFF9FA; border: 3px dashed #FFD1DC; padding: 30px; text-align: center; border-radius: 20px; cursor: pointer; color: var(--primary); font-weight: bold; }
        #fileStatus { margin-top: 15px; font-weight: bold; text-align: center; color: #50C878; }
        .leaflet-tooltip-own { background: rgba(255, 255, 255, 0.9); border: 1px solid var(--primary); color: var(--primary); font-weight: bold; font-size: 11px; padding: 1px 4px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2><span>🗺️ 即時預覽與資訊</span><button class="btn-pop" onclick="openFullMap()">🔍 全螢幕地圖</button></h2>
    <div id="map"></div>
    <div class="info-panel">
        <div class="info-item">🌍 偵測地點：<b id="detectedLocation">--</b></div>
        <div class="info-item">⏰ 與台時差：<b id="timeDiff">--</b></div>
        <div class="info-item">📏 總里程：<b id="totalDist">0.00</b> km</div>
        <div class="info-item">⏱️ 耗時預估：<b id="estTime">0</b> 分 <b id="estSec">0</b> 秒</div>
    </div>
</div>

<div class="card">
    <h2>🌺 功能 1~3：種花產生器</h2>
    <textarea id="coordsInput" oninput="handleInputChange()" placeholder="貼入座標 (緯度, 經度)"></textarea>
    <div class="controls">
        <div>
            <label>👤 人名</label>
            <select id="userName" onchange="toggleOtherName()">
                <option value="0嫿">0嫿</option><option value="1Corn">1Corn</option><option value="2Ht">2Ht</option><option value="3恰">3恰</option><option value="other">4其他</option>
            </select>
        </div>
        <div id="otherNameDiv" style="display:none;"><label>✍️ 自定義名字</label><input type="text" id="customName"></div>
        <div><label>📍 國家地名</label><input type="text" id="locName" value="地點"></div>
        <div><label>🆔 編號</label><input type="text" id="locID" value="01"></div>
        <div><label>🏙️ 都市名</label><input type="text" id="cityName" value="都市"></div>
        <div><label>📏 半徑(m)</label><input type="number" id="radius" value="30" oninput="handleInputChange()"></div>
        <div style="grid-column: span 2;">
            <label>🎡 路徑模式</label>
            <select id="mode" onchange="handleInputChange()">
                <option value="flower_pass2">功能 1：種花 + 巡邏 2 次 ✨</option>
                <option value="flower_only">功能 2：純種花模式 (Z) 🌺</option>
                <option value="pass_only">功能 3：純座標路徑 (果) 🚶</option>
            </select>
        </div>
        <div style="grid-column: span 2;"><button class="main-btn" onclick="generateGPX()">🎀 下載自定義 GPX</button></div>
    </div>
</div>

<div class="card">
    <h2>☁️ 功能 4：GPX 格式轉換大師</h2>
    <div class="file-box" onclick="document.getElementById('fileInput').click()">✨ 點擊上傳 GPX 進行轉換 ✨<input type="file" id="fileInput" accept=".gpx" style="display:none" onchange="handleFileUpload(this)"></div>
    <div id="fileStatus"></div>
    <div id="convertControls" style="display: none; margin-top: 15px; gap: 15px;" class="controls">
        <button class="main-btn" style="background: var(--secondary); margin-top:0;" onclick="convertAndDownload('wpt')">💾 轉 WPT</button>
        <button class="main-btn" style="background: var(--accent); margin-top:0;" onclick="convertAndDownload('rte')">🕹️ 轉 RTE</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var currentCoords = [], currentPathPoints = [], uploadedFileName = "";
const TARGET_SPEED = 19.5;
var map = L.map('map').setView([25.03, 121.5], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var previewLayer = L.layerGroup().addTo(map);

function toggleOtherName() { document.getElementById('otherNameDiv').style.display = (document.getElementById('userName').value === 'other') ? 'block' : 'none'; }

function getDistance(p1, p2) {
    const R = 6371e3, dLat = (p2[0]-p1[0])*Math.PI/180, dLon = (p2[1]-p1[1])*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 修正：更精確的 45M 延伸計算
function extendPoint(p1, p2, distMeters) {
    const dLat = p1[0] - p2[0], dLon = p1[1] - p2[1];
    const actualDist = getDistance(p1, p2);
    if(actualDist === 0) return p1;
    const ratio = distMeters / actualDist;
    return [p1[0] + dLat * ratio, p1[1] + dLon * ratio];
}

async function detectLocationInfo(lat, lon) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
        const data = await res.json();
        const addr = data.address; const city = addr.city || addr.town || addr.village || "";
        document.getElementById('detectedLocation').innerText = city ? `${city}, ${addr.country}` : addr.country;
        const diff = Math.round(lon/15)-8; document.getElementById('timeDiff').innerText = (diff>=0?"+":"")+diff+" 小時";
    } catch(e) { document.getElementById('detectedLocation').innerText = "自動偵測中..."; }
}

function handleInputChange() {
    const input = document.getElementById('coordsInput').value.trim(), mode = document.getElementById('mode').value, radius = parseFloat(document.getElementById('radius').value)||30;
    const coords = input.split('\n').map(l => {
        const p = l.split(/[\s,]+/); return p.length>=2 ? {lat:parseFloat(p[0]), lon:parseFloat(p[1])} : null;
    }).filter(c => c!==null);
    if(coords.length > 0 && (currentCoords.length===0 || coords[0].lat!==currentCoords[0].lat)) detectLocationInfo(coords[0].lat, coords[0].lon);
    updatePreview(coords, mode, radius);
}

function updatePreview(coords, mode, radius) {
    previewLayer.clearLayers(); currentPathPoints = []; currentCoords = coords;
    if(coords.length === 0) return;

    if(mode === 'flower_pass2') {
        const mid = {lat:(coords[0].lat + coords[coords.length-1].lat)/2, lon:(coords[0].lon + coords[coords.length-1].lon)/2};
        currentPathPoints.push([mid.lat, mid.lon]);
    } else if(coords.length >= 2) {
        currentPathPoints.push(extendPoint([coords[0].lat, coords[0].lon], [coords[1].lat, coords[1].lon], 45));
    } else {
        // 只有一點時退後一點點
        currentPathPoints.push([coords[0].lat - 0.0004, coords[0].lon]);
    }

    coords.forEach((c, i) => {
        L.circleMarker([c.lat, c.lon], {color: '#FF85A1', radius: 5, fillOpacity: 0.8})
         .addTo(previewLayer)
         .bindTooltip((mode === 'pass_only' ? 'T' : 'P') + (i + 1), {permanent: true, direction: 'right', className: 'leaflet-tooltip-own', offset: [5, 0]});

        currentPathPoints.push([c.lat, c.lon]);
        if(mode.includes('flower')) {
            const latOff = radius/111000, lonOff = radius/(111000*Math.cos(c.lat*Math.PI/180));
            [0, 60, 120, 180, 240, 300, 360].forEach(a => {
                const rad = (90-a)*Math.PI/180; currentPathPoints.push([c.lat+latOff*Math.sin(rad), c.lon+lonOff*Math.cos(rad)]);
            });
            currentPathPoints.push([c.lat, c.lon]);
        }
    });

    if(mode === 'flower_pass2') { 
        for(let k=0; k<2; k++) coords.forEach(c => currentPathPoints.push([c.lat, c.lon]));
        const mid = {lat:(coords[0].lat + coords[coords.length-1].lat)/2, lon:(coords[0].lon + coords[coords.length-1].lon)/2};
        currentPathPoints.push([mid.lat, mid.lon]);
    } else if(coords.length >= 2) {
        currentPathPoints.push(extendPoint([coords[coords.length-1].lat, coords[coords.length-1].lon], [coords[coords.length-2].lat, coords[coords.length-2].lon], 45));
    }

    let totalM = 0; for(let i=0; i<currentPathPoints.length-1; i++) totalM += getDistance(currentPathPoints[i], currentPathPoints[i+1]);
    const km = totalM/1000, totalMin = (km/TARGET_SPEED)*60;
    document.getElementById('totalDist').innerText = km.toFixed(2); document.getElementById('estTime').innerText = Math.floor(totalMin); document.getElementById('estSec').innerText = Math.round((totalMin%1)*60);
    const poly = L.polyline(currentPathPoints, {color: '#800000', weight: 2}).addTo(previewLayer); map.fitBounds(poly.getBounds());
}

function generateGPX() {
    if(currentCoords.length === 0) return alert("請貼入座標！");
    const mode = document.getElementById('mode').value, radius = parseFloat(document.getElementById('radius').value)||30;
    let nameVal = document.getElementById('userName').value; if(nameVal==='other') nameVal = document.getElementById('customName').value||"其他";
    let content = "";

    if(mode === 'flower_pass2') {
        const mid = {lat:(currentCoords[0].lat + currentCoords[currentCoords.length-1].lat)/2, lon:(currentCoords[0].lon + currentCoords[currentCoords.length-1].lon)/2};
        content += `<wpt lat="${mid.lat}" lon="${mid.lon}"><name>START</name></wpt>\n`;
    } else if(currentCoords.length >= 2) {
        const sb = extendPoint([currentCoords[0].lat, currentCoords[0].lon], [currentCoords[1].lat, currentCoords[1].lon], 45);
        content += `<wpt lat="${sb[0].toFixed(7)}" lon="${sb[1].toFixed(7)}"><name>BUFFER_START</name></wpt>\n`;
    }

    currentCoords.forEach((c, i) => {
        content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-C</name></wpt>\n`;
        if(mode.includes('flower')) {
            const latOff = radius/111000, lonOff = latOff / Math.cos(c.lat * Math.PI / 180);
            [0, 60, 120, 180, 240, 300].forEach((a, j) => {
                const rad = (90-a)*Math.PI/180; content += `<wpt lat="${(c.lat + latOff*Math.sin(rad)).toFixed(7)}" lon="${(c.lon + lonOff*Math.cos(rad)).toFixed(7)}"><name>P${i+1}-F${j+1}</name></wpt>\n`;
            });
            content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-B</name></wpt>\n`;
        }
    });

    if(mode === 'flower_pass2') { 
        for(let j=1; j<=2; j++) currentCoords.forEach((c, i) => content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-R${j}</name></wpt>\n`); 
        const mid = {lat:(currentCoords[0].lat + currentCoords[currentCoords.length-1].lat)/2, lon:(currentCoords[0].lon + currentCoords[currentCoords.length-1].lon)/2};
        content += `<wpt lat="${mid.lat}" lon="${mid.lon}"><name>END</name></wpt>\n`;
    } else if(currentCoords.length >= 2) {
        const eb = extendPoint([currentCoords[currentCoords.length-1].lat, currentCoords[currentCoords.length-1].lon], [currentCoords[currentCoords.length-2].lat, currentCoords[currentCoords.length-2].lon], 45);
        content += `<wpt lat="${eb[0].toFixed(7)}" lon="${eb[1].toFixed(7)}"><name>BUFFER_END</name></wpt>\n`;
    }

    const suffix = (mode==='flower_pass2'?'_環串':(mode==='flower_only'?'_環':'(果)'));
    const fileName = `${nameVal}_${document.getElementById('locName').value}${document.getElementById('locID').value}_${document.getElementById('cityName').value}_${currentCoords.length}苗${suffix}.gpx`;
    const full = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Gemini" xmlns="http://www.topografix.com/GPX/1/1">\n${content}</gpx>`;
    const blob = new Blob([full], {type:'application/gpx+xml'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
}

function handleFileUpload(input) {
    const file = input.files[0]; if(!file) return;
    uploadedFileName = file.name.replace('.gpx', '');
    const reader = new FileReader();
    reader.onload = function(e) {
        const parser = new DOMParser(), xml = parser.parseFromString(e.target.result, "text/xml");
        let nodes = Array.from(xml.querySelectorAll("trkpt, rtept, wpt"));
        const coords = nodes.map(n => ({lat: parseFloat(n.getAttribute("lat")), lon: parseFloat(n.getAttribute("lon"))}));
        updatePreview(coords, 'pass_only', 0);
        document.getElementById('fileStatus').innerText = `✅ 已載入 ${coords.length} 個點位`;
        document.getElementById('convertControls').style.display = 'grid';
    };
    reader.readAsText(file);
}

function convertAndDownload(type) {
    let content = "";
    if(type === 'wpt') { currentCoords.forEach((c, i) => content += `<wpt lat="${c.lat.toFixed(7)}" lon="${c.lon.toFixed(7)}"><name>P${i+1}</name></wpt>\n`); }
    else { content += `<rte><name>Route</name>\n`; currentCoords.forEach((c, i) => content += `<rtept lat="${c.lat.toFixed(7)}" lon="${c.lon.toFixed(7)}"><name>${i+1}</name></rtept>\n`); content += `</rte>\n`; }
    const full = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Gemini" xmlns="http://www.topografix.com/GPX/1/1">\n${content}</gpx>`;
    const blob = new Blob([full], {type:'application/gpx+xml'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${uploadedFileName}_Converted.gpx`; a.click();
}

function openFullMap() {
    const newWin = window.open("", "_blank");
    newWin.document.write(`<html><body style="margin:0;"><div id="fMap" style="height:100vh;"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /><script>var fMap = L.map('fMap'); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(fMap); var poly = L.polyline(${JSON.stringify(currentPathPoints)}, {color: '#800000'}).addTo(fMap); fMap.fitBounds(poly.getBounds());<\/script></body></html>`);
}
</script>
</body>
</html>
