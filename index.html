<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 GPX 夢幻地圖助手 - 專業轉換版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #FF85A1;
            --secondary: #77DDFF;
            --accent: #FFB347;
            --path-color: #800000; /* 酒紅色路徑 */
            --bg: #FFF5F7;
            --card-bg: #FFFFFF;
        }
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; background-color: var(--bg); color: #555; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(255, 133, 161, 0.1); margin-bottom: 20px; border: 3px solid #FFD1DC; position: relative; }
        h2 { color: var(--primary); margin-top: 0; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; justify-content: space-between; }
        .btn-pop { font-size: 0.6em; background: var(--secondary); color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; text-decoration: none; border: none; font-weight: bold; }
        textarea { width: 100%; height: 120px; margin: 10px 0; border: 2px solid #FFE4E1; border-radius: 15px; padding: 12px; box-sizing: border-box; outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 0.85em; color: #886666; margin-bottom: 5px; font-weight: bold; }
        select, input { padding: 12px; border-radius: 12px; border: 2px solid #F0F0F0; width: 100%; box-sizing: border-box; background: #FAFAFA; outline: none; }
        button.main-btn { background: linear-gradient(135deg, var(--primary), #FF6B81); color: white; border: none; cursor: pointer; font-weight: bold; padding: 14px; border-radius: 12px; font-size: 16px; width: 100%; margin-top: 10px; box-shadow: 0 5px 15px rgba(255,133,161,0.3); transition: 0.3s; }
        button.main-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        #map { height: 350px; width: 100%; border-radius: 20px; border: 3px solid #FFD1DC; margin-top: 10px; z-index: 1; }
        .file-box { background: #FFF9FA; border: 3px dashed #FFD1DC; padding: 30px; text-align: center; border-radius: 20px; cursor: pointer; color: var(--primary); font-weight: bold; transition: 0.3s; }
        .file-box:hover { background: #FFE4E1; }
        #fileStatus { margin-top: 15px; font-weight: bold; text-align: center; color: #50C878; min-height: 1.2em; }
        .footer-info { font-size: 0.8em; color: #BBAAAA; text-align: center; margin-top: 20px; }
        
        /* 地圖標籤樣式 */
        .leaflet-tooltip-own {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            font-size: 11px;
            padding: 1px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>
        <span>🗺️ 路徑即時預覽 (酒紅線條)</span>
        <button class="btn-pop" onclick="openFullMap()">🔍 全螢幕開啟地圖</button>
    </h2>
    <div id="map"></div>
</div>

<div class="card">
    <h2>🌺 功能 1~3：種花路徑產生器</h2>
    <label>🍭 請貼入原始座標 (緯度, 經度):</label>
    <textarea id="coordsInput" oninput="updatePreviewFromText()" placeholder="例如：39.9334, 32.8597"></textarea>

    <div class="controls">
        <div><label>📍 國家地名</label><input type="text" id="locName" value="地點"></div>
        <div><label>🆔 編號</label><input type="text" id="locID" value="01"></div>
        <div><label>📏 種花半徑 (m)</label><input type="number" id="radius" value="30" oninput="updatePreviewFromText()"></div>
        <div>
            <label>🎡 路徑模式</label>
            <select id="mode" onchange="updatePreviewFromText()">
                <option value="flower_pass2">種花 + 回訪二次 (Z串) ✨</option>
                <option value="flower_only">純種花模式 (Z) 🌺</option>
                <option value="pass_only">純座標路徑 (果) 🚶</option>
            </select>
        </div>
        <div style="grid-column: span 2;">
            <button class="main-btn" onclick="generateGPX()">確認無誤，下載夢幻 GPX 🎀</button>
        </div>
    </div>
</div>

<div class="card">
    <h2>☁️ 功能 4：GPX 格式轉換大師</h2>
    <div class="file-box" onclick="document.getElementById('fileInput').click()">
        ✨ 點擊上傳 GPX 檔案 ✨
        <input type="file" id="fileInput" accept=".gpx" style="display:none" onchange="handleFileUpload(this)">
    </div>
    <div id="fileStatus"></div>
    
    <div id="convertControls" style="display: none; margin-top: 15px; gap: 15px;" class="controls">
        <button class="main-btn" style="background: var(--secondary); margin-top:0;" onclick="convertAndDownload('wpt')">💾 轉為 Fake GPS (WPT)</button>
        <button class="main-btn" style="background: var(--accent); margin-top:0;" onclick="convertAndDownload('rte')">🕹️ 轉為 Joystick (RTE)</button>
    </div>
</div>

<p class="footer-info">☁️ 支援酒紅路徑預覽 ‧ 自動辨識點位 ‧ 點位編號標籤 ☁️</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// --- 全域變數 ---
var currentCoords = [];
var currentPathPoints = [];
var currentMode = 'flower_pass2';
var uploadedFileName = "";

var map = L.map('map').setView([25.033, 121.565], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var previewLayer = L.layerGroup().addTo(map);

// --- 核心預覽邏輯 ---
function updatePreview(coords, mode, radius) {
    previewLayer.clearLayers();
    currentPathPoints = [];
    currentCoords = coords;
    currentMode = mode;
    
    if (coords.length === 0) return;

    const mid = { lat: (coords[0].lat + coords[coords.length-1].lat) / 2, lon: (coords[0].lon + coords[coords.length-1].lon) / 2 };
    currentPathPoints.push([mid.lat, mid.lon]);

    coords.forEach((c, i) => {
        const labelText = (mode === 'pass_only') ? `T${i+1}` : `P${i+1}`;
        L.circleMarker([c.lat, c.lon], {color: '#FF85A1', radius: 4, fillOpacity: 0.5})
            .addTo(previewLayer)
            .bindTooltip(labelText, {permanent: true, direction: 'right', className: 'leaflet-tooltip-own', offset: [5, 0]});

        currentPathPoints.push([c.lat, c.lon]);
        
        if (mode.includes('flower')) {
            const latOff = radius / 111000;
            const lonOff = radius / (111000 * Math.cos(c.lat * Math.PI / 180));
            [0, 60, 120, 180, 240, 300].forEach(a => {
                const rad = (90 - a) * Math.PI / 180;
                currentPathPoints.push([c.lat + latOff * Math.sin(rad), c.lon + lonOff * Math.cos(rad)]);
            });
            currentPathPoints.push([c.lat, c.lon]);
        }
    });
    
    currentPathPoints.push([mid.lat, mid.lon]);
    var polyline = L.polyline(currentPathPoints, {color: '#800000', weight: 3, opacity: 0.8}).addTo(previewLayer);
    map.fitBounds(polyline.getBounds(), {padding: [20, 20]});
}

function updatePreviewFromText() {
    const input = document.getElementById('coordsInput').value.trim();
    const mode = document.getElementById('mode').value;
    const radius = parseFloat(document.getElementById('radius').value) || 30;
    const coords = input.split('\n').map(l => {
        const p = l.split(/[\s,]+/);
        return p.length >= 2 ? { lat: parseFloat(p[0]), lon: parseFloat(p[1]) } : null;
    }).filter(c => c !== null);
    updatePreview(coords, mode, radius);
}

// --- 功能 4：上傳與轉換邏輯 ---
function handleFileUpload(input) {
    const file = input.files[0];
    if (!file) return;
    
    uploadedFileName = file.name.replace('.gpx', '');
    const reader = new FileReader();
    reader.onload = function(e) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(e.target.result, "text/xml");
        let nodes = Array.from(xml.querySelectorAll("trkpt, rtept, wpt"));
        
        if (nodes.length === 0) {
            alert("找不到點位座標！");
            return;
        }

        const coords = nodes.map(n => ({
            lat: parseFloat(n.getAttribute("lat")),
            lon: parseFloat(n.getAttribute("lon"))
        }));

        updatePreview(coords, 'pass_only', 0);
        document.getElementById('fileStatus').innerText = `✅ 已載入 ${coords.length} 個點位，請選擇轉換格式：`;
        document.getElementById('convertControls').style.display = 'grid';
    };
    reader.readAsText(file);
}

function convertAndDownload(type) {
    if (currentCoords.length === 0) return;
    
    const gpxHeader = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Gemini" xmlns="http://www.topografix.com/GPX/1/1">`;
    let content = "";
    let suffix = "";

    if (type === 'wpt') {
        suffix = "_FakeGPS_WPT";
        currentCoords.forEach((c, i) => {
            content += `<wpt lat="${c.lat.toFixed(7)}" lon="${c.lon.toFixed(7)}"><name>P${i+1}</name></wpt>\n`;
        });
    } else {
        suffix = "_Joystick_RTE";
        content += `<rte><name>Joystick Route</name>\n`;
        currentCoords.forEach((c, i) => {
            content += `<rtept lat="${c.lat.toFixed(7)}" lon="${c.lon.toFixed(7)}"><name>${i+1}</name></rtept>\n`;
        });
        content += `</rte>\n`;
    }

    const fullGPX = `${gpxHeader}\n${content}</gpx>`;
    const blob = new Blob([fullGPX], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${uploadedFileName || "Converted"}${suffix}.gpx`;
    a.click();
}

// --- 下載 GPX (功能 1~3) ---
function generateGPX() {
    const locName = document.getElementById('locName').value || "Location";
    const locID = document.getElementById('locID').value || "01";
    const mode = document.getElementById('mode').value;
    const radius = parseFloat(document.getElementById('radius').value) || 30;
    
    if (currentCoords.length === 0) { alert("請先貼入座標！🌸"); return; }
    
    let suffix = (mode === "pass_only") ? "_果" : (mode === "flower_pass2" ? "_Z串" : "_Z");
    const name = `${locName}${locID}_${currentCoords.length}苗${suffix}.gpx`;
    
    let content = "";
    const mid = { lat: (currentCoords[0].lat + currentCoords[currentCoords.length-1].lat) / 2, lon: (currentCoords[0].lon + currentCoords[currentCoords.length-1].lon) / 2 };
    content += `<wpt lat="${mid.lat.toFixed(7)}" lon="${mid.lon.toFixed(7)}"><name>START</name></wpt>\n`;
    
    currentCoords.forEach((c, i) => {
        if (mode.includes('flower')) {
            const latOff = radius / 111000;
            const lonOff = radius / (111000 * Math.cos(c.lat * Math.PI / 180));
            content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-Center</name></wpt>\n`;
            [0, 60, 120, 180, 240, 300].forEach((a, j) => {
                const rad = (90 - a) * Math.PI / 180;
                content += `<wpt lat="${(c.lat + latOff * Math.sin(rad)).toFixed(7)}" lon="${(c.lon + lonOff * Math.cos(rad)).toFixed(7)}"><name>P${i+1}-F${j+1}</name></wpt>\n`;
            });
            content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-Back</name></wpt>\n`;
        } else {
            content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}</name></wpt>\n`;
        }
    });

    if (mode === 'flower_pass2') {
        currentCoords.forEach((c, i) => content += `<wpt lat="${c.lat}" lon="${c.lon}"><name>P${i+1}-2nd</name></wpt>\n`);
    }
    
    content += `<wpt lat="${mid.lat.toFixed(7)}" lon="${mid.lon.toFixed(7)}"><name>END</name></wpt>\n`;

    const full = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1">\n${content}</gpx>`;
    const blob = new Blob([full], { type: 'application/gpx+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// --- 全螢幕地圖 ---
function openFullMap() {
    if (currentPathPoints.length === 0) { alert("目前沒有路徑可以檢視喔！🌸"); return; }
    const newWin = window.open("", "_blank");
    newWin.document.write(`
        <html><head><title>全螢幕預覽</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>#fMap { height: 100vh; width: 100vw; margin: 0; } .leaflet-tooltip-own { background: white; border: 1px solid #FF85A1; color: #FF85A1; font-weight: bold; }</style>
        </head><body style="margin:0;"><div id="fMap"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
        <script>
            var fMap = L.map('fMap');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(fMap);
            var pts = ${JSON.stringify(currentPathPoints)};
            var poly = L.polyline(pts, {color: '#800000', weight: 4}).addTo(fMap);
            fMap.fitBounds(poly.getBounds());
        <\/script></body></html>
    `);
}
</script>
</body>
</html>
